name: Release KDE Plasmoid

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.1.0)"
        required: true
        default: "1.1.0"
      prerelease:
        description: "Mark as pre-release ?"
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext zip

      - name: Determine version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update metadata.json
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          sed -i "s/\"Version\": \".*\"/\"Version\": \"$VERSION\"/" metadata.json

      - name: Compile translations
        run: |
          chmod +x translate/build.sh
          ./translate/build.sh

      - name: Create plasmoid archive
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # Exclude non-plasmoid folders and files
          zip -r com.github.yoanndev90.modernreclock-$VERSION.plasmoid . -x "translate/*" "assets/*" ".git/*" ".github/*" "README.md" "LICENSE" "install-*.sh" "com.github.yoanndev90.modernreclock-*.plasmoid"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Modern reClock v${{ steps.get_version.outputs.version }}
          body: |
            # Modern reClock v${{ steps.get_version.outputs.version }}

            A modern clock widget for your KDE Plasma 6 desktop.

            ### New Features
            - Translation support (French included).
            - Real-time updates for language and format settings.
            - Optimized structure for Plasma 6.

            ### Installation
            1. Download `com.github.yoanndev90.modernreclock-${{ steps.get_version.outputs.version }}.plasmoid`.
            2. Install it via :
               ```bash
               kpackagetool6 -t Plasma/Applet -i com.github.yoanndev90.modernreclock-${{ steps.get_version.outputs.version }}.plasmoid
               ```
            3. Or use the Plasma installer ("Add Widgets" > "Install from Local File").
          files: |
            *.plasmoid
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
