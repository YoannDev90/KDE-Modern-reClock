name: Release KDE Plasmoid

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.1.0)"
        required: true
        default: "1.1.0"
      prerelease:
        description: "Mark as pre-release ?"
        required: false
        default: false
        type: boolean

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev qt6-declarative-dev kf6-coreaddons-dev
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            sudo apt-get install -y qemu-user-static binfmt-support
            docker run --rm --platform linux/arm64 -v $(pwd):/src -w /src ubuntu:24.04 bash -c "
              apt-get update && apt-get install -y cmake g++ qt6-base-dev qt6-declarative-dev kf6-coreaddons-dev &&
              mkdir -p build && cd build && cmake .. -DCMAKE_INSTALL_PREFIX=/usr && make -j\$(nproc)
            "
            cp build/modernreclock_timezone modernreclock_timezone_aarch64.so
          else
            mkdir -p build && cd build
            cmake .. -DCMAKE_INSTALL_PREFIX=/usr
            make -j$(nproc)
            cd ..
            cp build/modernreclock_timezone modernreclock_timezone_x86_64.so
          fi

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.arch }}
          path: modernreclock_timezone_*.so

  release:
    needs: build-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext zip

      - name: Determine version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            CHANGES=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          # Escape for GitHub Actions output
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update metadata.json
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          sed -i "s/\"Version\": \".*\"/\"Version\": \"$VERSION\"/" metadata.json

      - name: Compile translations
        run: |
          chmod +x translate/build.sh
          ./translate/build.sh

      - name: Create plasmoid archive
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # Exclude non-plasmoid folders and files
          zip -r com.github.yoanndev90.modernreclock-$VERSION.plasmoid . -x "translate/*" "assets/*" ".git/*" ".github/*" "README.md" "LICENSE" "install-*.sh" "CMakeLists.txt" "src/*" "build/*" "bin/*" "com.github.yoanndev90.modernreclock-*.plasmoid"

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          path: plugin-artifacts

      - name: Prepare release assets
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          mkdir -p release-assets

          # Copy plasmoid
          cp *.plasmoid release-assets/

          # Raw .so files for each arch
          for arch_dir in plugin-artifacts/plugin-*; do
            ARCH=$(basename "$arch_dir" | sed 's/plugin-//')
            cp "$arch_dir"/*.so "release-assets/modernreclock_timezone_${ARCH}.so"
          done

          # Offline install zip for each arch
          for arch_dir in plugin-artifacts/plugin-*; do
            ARCH=$(basename "$arch_dir" | sed 's/plugin-//')
            TMPDIR=$(mktemp -d)
            mkdir -p "$TMPDIR/$ARCH"
            cp "$arch_dir"/*.so "$TMPDIR/$ARCH/modernreclock_timezone.so"
            printf 'module org.kde.plasma.private.modernreclock\nplugin modernreclock_timezone\n' > "$TMPDIR/$ARCH/qmldir"
            (cd "$TMPDIR" && zip -r "$OLDPWD/release-assets/modernreclock-timezone-${VERSION}-${ARCH}.zip" "$ARCH/")
            rm -rf "$TMPDIR"
          done

          # install-dist.sh for remote one-line install
          cp install-dist.sh "release-assets/install-dist.sh"

          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Modern reClock v${{ steps.get_version.outputs.version }}
          body: |
            # Modern reClock v${{ steps.get_version.outputs.version }}

            A modern clock widget for your KDE Plasma 6 desktop.

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ### Installation

            #### Quick install (recommended)
            ```bash
            sh -c "$(curl -fsSL https://github.com/YoannDev90/KDE-Modern-reClock/releases/download/v${{ steps.get_version.outputs.version }}/install-dist.sh)"
            ```

            #### Manual install
            1. Download `com.github.yoanndev90.modernreclock-${{ steps.get_version.outputs.version }}.plasmoid`
            2. Install:
               ```bash
               kpackagetool6 -t Plasma/Applet -i com.github.yoanndev90.modernreclock-${{ steps.get_version.outputs.version }}.plasmoid
               ```
            3. Or use Plasma installer ("Add Widgets" > "Install from Local File")

            #### Offline install (no internet required)
            1. Download the `.plasmoid` + the offline zip matching your arch (`x86_64` or `aarch64`)
            2. Extract the zip, run `install-local.sh` from the extracted folder

            #### Files
            | File | Description |
            |------|-------------|
            | `*.plasmoid` | Widget package |
            | `modernreclock_timezone_*.so` | Timezone plugin (raw, for manual install) |
            | `modernreclock-timezone-*.zip` | Offline install zip (plugin + qmldir) |
            | `install-dist.sh` | One-line remote install script |
          files: |
            release-assets/*
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
