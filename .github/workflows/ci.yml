name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev qt6-base-dev gettext

      - name: Validate KCFG XML
        run: |
          echo "--- Validating main.xml ---"
          xmllint --noout contents/config/main.xml && echo "✓ main.xml is valid XML" || exit 1

      - name: Validate metadata.json
        run: |
          echo "--- Validating metadata.json ---"
          python3 -c "import json; json.load(open('metadata.json'))" && echo "✓ metadata.json is valid JSON" || exit 1

      - name: Validate translations
        run: |
          echo "--- Checking .po files ---"
          for po in translate/*.po; do
            msgfmt --check "$po" -o /dev/null && echo "✓ $po is valid" || exit 1
          done

      - name: Compile translations
        run: |
          chmod +x translate/build.sh
          ./translate/build.sh

      - name: Validate QML syntax
        run: |
          echo "--- Checking QML files for basic syntax ---"
          for qml in contents/ui/*.qml contents/config/*.qml; do
            if [ -f "$qml" ]; then
              echo "Checking $qml..."
              python3 -c "
          import sys
          with open('$qml', 'r') as f:
              content = f.read()
          # Basic checks: balanced braces
          opens = content.count('{')
          closes = content.count('}')
          if opens != closes:
              print(f'⚠ Warning: $qml has unbalanced braces ({opens} open, {closes} close)')
              sys.exit(1)
          # Check for common issues
          if 'anchors.fill: parent' in content and 'SimpleKCM' in content:
              print(f'⚠ Warning: $qml uses anchors.fill in SimpleKCM (causes layout loops)')
              sys.exit(1)
          print(f'✓ $qml passed basic checks')
          " || exit 1
            fi
          done

      - name: Build plasmoid package
        run: |
          echo "--- Creating plasmoid archive ---"
          zip -r /tmp/test-build.plasmoid . -x ".git/*" ".github/*" "translate/*" "assets/*" "install-*.sh" "README.md" "LICENSE"
          echo "✓ Build successful"
          ls -lh /tmp/test-build.plasmoid
