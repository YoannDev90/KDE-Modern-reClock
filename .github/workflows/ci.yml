name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-qmllint-plugins qt6-base-dev gettext libxml2-utils

      - name: Validate KCFG XML
        run: |
          LOG="ci-report.txt"
          echo "=== CI VALIDATION REPORT ===" > "$LOG"
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$LOG"
          echo "Branch: $GITHUB_REF_NAME" >> "$LOG"
          echo "Commit: $GITHUB_SHA" >> "$LOG"
          echo "" >> "$LOG"
          echo "--- [1/6] Validating main.xml ---" | tee -a "$LOG"
          if xmllint --noout contents/config/main.xml 2>&1; then
            echo "✓ main.xml is valid XML" | tee -a "$LOG"
          else
            echo "✗ main.xml is INVALID" | tee -a "$LOG"
            xmllint --noout contents/config/main.xml 2>&1 | tee -a "$LOG"
            echo "RESULT=FAIL" >> "$LOG"
          fi

      - name: Validate metadata.json
        run: |
          LOG="ci-report.txt"
          echo "" >> "$LOG"
          echo "--- [2/6] Validating metadata.json ---" | tee -a "$LOG"
          if python3 -c "import json; json.load(open('metadata.json'))" 2>&1; then
            echo "✓ metadata.json is valid JSON" | tee -a "$LOG"
          else
            echo "✗ metadata.json is INVALID" | tee -a "$LOG"
            python3 -c "import json; json.load(open('metadata.json'))" 2>&1 | tee -a "$LOG"
          fi

      - name: Validate QML syntax
        run: |
          LOG="ci-report.txt"
          echo "" >> "$LOG"
          echo "--- [3/6] Validating QML files ---" | tee -a "$LOG"
          ERRORS=0
          WARNINGS=0

          # Check which tools are available
          HAS_QMLLINT=false
          HAS_QMLFORMAT=false
          if command -v qmllint &>/dev/null; then HAS_QMLLINT=true; fi
          if command -v qmlformat &>/dev/null; then HAS_QMLFORMAT=true; fi

          if [ "$HAS_QMLLINT" = false ] && [ "$HAS_QMLFORMAT" = false ]; then
            echo "⚠ Neither qmllint nor qmlformat found — skipping QML syntax check" | tee -a "$LOG"
            echo "  Install qt6-declarative-dev-tools for full validation" >> "$LOG"
          else
            for qml in contents/ui/*.qml contents/config/*.qml; do
              echo "" >> "$LOG"
              echo "  File: $qml" >> "$LOG"

              if [ "$HAS_QMLLINT" = true ]; then
                OUTPUT=$(qmllint --no-copyright "$qml" 2>&1) || true
                if [ -z "$OUTPUT" ]; then
                  echo "  ✓ OK (qmllint clean)" | tee -a "$LOG"
                else
                  echo "  ⚠ qmllint issues:" | tee -a "$LOG"
                  echo "$OUTPUT" | tee -a "$LOG"
                  WARNINGS=$((WARNINGS + 1))
                  # Fallback to qmlformat if available
                  if [ "$HAS_QMLFORMAT" = true ]; then
                    FMT_OUTPUT=$(qmlformat --check "$qml" 2>&1) || true
                    if [ -z "$FMT_OUTPUT" ]; then
                      echo "  ✓ qmlformat check passed" | tee -a "$LOG"
                    else
                      echo "  ✗ qmlformat check FAILED" | tee -a "$LOG"
                      echo "$FMT_OUTPUT" | tee -a "$LOG"
                      ERRORS=$((ERRORS + 1))
                    fi
                  fi
                fi
              elif [ "$HAS_QMLFORMAT" = true ]; then
                FMT_OUTPUT=$(qmlformat --check "$qml" 2>&1) || true
                if [ -z "$FMT_OUTPUT" ]; then
                  echo "  ✓ OK (qmlformat clean)" | tee -a "$LOG"
                else
                  echo "  ⚠ qmlformat issues:" | tee -a "$LOG"
                  echo "$FMT_OUTPUT" | tee -a "$LOG"
                  WARNINGS=$((WARNINGS + 1))
                fi
              fi
            done
          fi

          echo "" >> "$LOG"
          echo "QML summary: $WARNINGS file(s) with warnings, $ERRORS file(s) with errors" | tee -a "$LOG"
          if [ "$ERRORS" -gt 0 ]; then
            echo "RESULT=FAIL" >> "$LOG"
          fi

      - name: Validate translations
        run: |
          LOG="ci-report.txt"
          echo "" >> "$LOG"
          echo "--- [4/6] Validating .po translation files ---" | tee -a "$LOG"
          PO_ERRORS=0
          for po in translate/*.po; do
            PO_OUTPUT=$(msgfmt --check "$po" -o /dev/null 2>&1) || true
            if [ -z "$PO_OUTPUT" ]; then
              echo "  ✓ $po" | tee -a "$LOG"
            else
              echo "  ✗ $po" | tee -a "$LOG"
              echo "$PO_OUTPUT" | tee -a "$LOG"
              PO_ERRORS=$((PO_ERRORS + 1))
            fi
          done
          echo "PO summary: $PO_ERRORS file(s) with errors" | tee -a "$LOG"

      - name: Compile translations
        run: |
          LOG="ci-report.txt"
          echo "" >> "$LOG"
          echo "--- [5/6] Compiling translations ---" | tee -a "$LOG"
          chmod +x translate/build.sh
          BUILD_OUTPUT=$(./translate/build.sh 2>&1) || true
          if [ -z "$BUILD_OUTPUT" ] || ! echo "$BUILD_OUTPUT" | grep -qi "error"; then
            echo "✓ Translation compilation succeeded" | tee -a "$LOG"
            echo "$BUILD_OUTPUT" >> "$LOG"
          else
            echo "✗ Translation compilation FAILED" | tee -a "$LOG"
            echo "$BUILD_OUTPUT" | tee -a "$LOG"
          fi

      - name: Build plasmoid package
        run: |
          LOG="ci-report.txt"
          echo "" >> "$LOG"
          echo "--- [6/6] Building plasmoid package ---" | tee -a "$LOG"
          zip -r /tmp/test-build.plasmoid . -x ".git/*" ".github/*" "translate/*" "assets/*" "install-*.sh" "README.md" "LICENSE" 2>&1 | tee -a "$LOG" || true
          if [ -f /tmp/test-build.plasmoid ]; then
            echo "✓ Build successful" | tee -a "$LOG"
            ls -lh /tmp/test-build.plasmoid | tee -a "$LOG"
          else
            echo "✗ Build FAILED" | tee -a "$LOG"
          fi

      - name: Final report
        if: always()
        run: |
          LOG="ci-report.txt"
          echo "" >> "$LOG"
          echo "========================================" >> "$LOG"
          if grep -q "RESULT=FAIL" "$LOG"; then
            echo "OVERALL: ✗ FAILED — see errors above" | tee -a "$LOG"
          else
            echo "OVERALL: ✓ ALL CHECKS PASSED" | tee -a "$LOG"
          fi
          echo "========================================" >> "$LOG"
          echo "" >> "$LOG"
          echo "--- Full report ---"
          cat "$LOG"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.txt
          retention-days: 30
