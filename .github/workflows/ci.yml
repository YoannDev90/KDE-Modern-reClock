name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qt6-base-dev gettext libxml2-utils

      - name: Validate KCFG XML
        run: |
          echo "--- Validating main.xml ---"
          xmllint --noout contents/config/main.xml && echo "✓ main.xml is valid XML" || exit 1

      - name: Validate metadata.json
        run: |
          echo "--- Validating metadata.json ---"
          python3 -c "import json; json.load(open('metadata.json'))" && echo "✓ metadata.json is valid JSON" || exit 1

      - name: Validate QML syntax
        run: |
          echo "--- Validating QML files with qmllint ---"
          ERRORS=0
          for qml in contents/ui/*.qml contents/config/*.qml; do
            if qmllint --no-copyright "$qml" 2>/dev/null; then
              echo "✓ $qml"
            else
              echo "⚠ $qml (qmllint returned warnings — checking syntax only)"
              # Fallback: check basic QML parse with qmlformat dry-run
              if qmlformat --check "$qml" 2>/dev/null; then
                echo "  ✓ $qml passes qmlformat check"
              else
                echo "  ✗ $qml has syntax errors"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "✗ $ERRORS file(s) have QML syntax errors"
            exit 1
          fi
          echo "✓ All QML files validated"

      - name: Validate translations
        run: |
          echo "--- Checking .po files ---"
          for po in translate/*.po; do
            msgfmt --check "$po" -o /dev/null && echo "✓ $po is valid" || exit 1
          done

      - name: Compile translations
        run: |
          chmod +x translate/build.sh
          ./translate/build.sh

      - name: Build plasmoid package
        run: |
          echo "--- Creating plasmoid archive ---"
          zip -r /tmp/test-build.plasmoid . -x ".git/*" ".github/*" "translate/*" "assets/*" "install-*.sh" "README.md" "LICENSE"
          echo "✓ Build successful"
          ls -lh /tmp/test-build.plasmoid
