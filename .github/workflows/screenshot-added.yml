name: Community Screenshot Added

on:
    issues:
        types: [labeled]

jobs:
    add_screenshot:
        if: github.event.label.name == '✅ - Validated Community Screenshot'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Process Screenshot
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
              run: |
                  mkdir -p assets/community

                  # Extract first image URL from issue body
                  IMG_URL=$(echo "$ISSUE_BODY" | grep -oE "https://(github.com|user-images.githubusercontent.com)/[a-zA-Z0-9./_-]+/(assets|user-attachments|files)/[a-zA-Z0-9-]+" | head -n 1)

                  if [ -z "$IMG_URL" ]; then
                    echo "Error: No image URL found in issue body."
                    exit 1
                  fi

                  ISSUE_NUM="${{ github.event.issue.number }}"
                  USER_NAME="${{ github.event.issue.user.login }}"
                  FILE_EXT="${IMG_URL##*.}"

                  # Default to png if no extension found or if it looks like a hash
                  if [[ "$FILE_EXT" == "$IMG_URL" ]] || [[ ${#FILE_EXT} -gt 4 ]]; then
                    FILE_EXT="png"
                  fi

                  FILE_NAME="screenshot_${ISSUE_NUM}_${USER_NAME}.${FILE_EXT}"
                  DEST_PATH="assets/community/$FILE_NAME"

                  echo "Downloading $IMG_URL to $DEST_PATH"

                  # Download with size limit (5MB max) and validate it's an image
                  HTTP_CODE=$(curl -L -o "$DEST_PATH" "$IMG_URL" --max-filesize 5242880 -s -w "%{http_code}")

                  if [ "$HTTP_CODE" -ne 200 ]; then
                    echo "Error: Failed to download image (HTTP $HTTP_CODE)"
                    rm -f "$DEST_PATH"
                    exit 1
                  fi

                  # Validate the file is actually an image
                  FILE_MIME=$(file --mime-type -b "$DEST_PATH" 2>/dev/null || echo "")
                  if [[ ! "$FILE_MIME" =~ ^image/ ]]; then
                    echo "Error: Downloaded file is not an image (type: $FILE_MIME)"
                    rm -f "$DEST_PATH"
                    exit 1
                  fi

                  echo "✓ Downloaded and validated: $FILE_MIME"

                  # Prepare table row
                  REPO_FULL_NAME="${{ github.repository }}"
                  NEW_ROW="| ![$USER_NAME](https://github.com/${REPO_FULL_NAME}/blob/main/${DEST_PATH}?raw=true) |"

                  # Insert new row before the END marker so it lands after the table header
                  awk -v row="$NEW_ROW" '/<!-- COMMUNITY_SCREENSHOTS_END -->/{print row} {print}' README.md > README.md.tmp && mv README.md.tmp README.md

                  # Git commit and push
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add assets/community/ README.md
                  git commit -m "docs: add community screenshot from issue #$ISSUE_NUM (@$USER_NAME)"
                  git push

            - name: Close Issue
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh issue close ${{ github.event.issue.number }} --comment "Screenshot successfully added to the README! Thank you for your contribution! ✨"
