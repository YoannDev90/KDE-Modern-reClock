name: Feature Request
description: Suggest a new feature or improvement
title: '[Feature] '
labels: ['✨ Feature']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make Modern reClock even better? Share it below!

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's your use case?
      placeholder: "e.g. I always forget what timezone my friend is in, so I want..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Clock / Time display
        - Date / Day display
        - Custom text element
        - Timezone
        - Settings UI
        - Themes / Styling
        - Other
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Screenshots
      description: If you have a visual idea, attach it here.
